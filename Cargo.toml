[workspace]
members = ["crates/inodune-core", "crates/inodune-clean", "crates/inodune-cli", "apps/desktop/src-tauri"]
default-members = ["crates/inodune-core", "crates/inodune-clean", "crates/inodune-cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
inodune-core = { path = "crates/inodune-core" }
inodune-clean = { path = "crates/inodune-clean" }

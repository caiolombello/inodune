name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Exercise per-user install lifecycle in temporary prefixes
        run: python3 scripts/test-user-lifecycle.py
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned Bubblewrap for Git sandbox tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcap-dev meson ninja-build

          archive="$RUNNER_TEMP/bubblewrap-0.13.1.tar.xz"
          curl --fail --location --retry 3 \
            https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            '0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d' \
            "$archive" | sha256sum --check --status

          source_dir="$RUNNER_TEMP/bubblewrap-0.13.1"
          build_dir="$RUNNER_TEMP/bubblewrap-build"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          meson setup "$build_dir" "$source_dir" \
            --prefix=/usr \
            -Dtests=false \
            -Dman=disabled \
            -Dbash_completion=disabled \
            -Dzsh_completion=disabled
          ninja -C "$build_dir"
          sudo install -D -m 0755 "$build_dir/bwrap" /usr/bin/bwrap

          test "$(/usr/bin/bwrap --version)" = 'bubblewrap 0.13.1'
          /usr/bin/bwrap --help ro-bind-fd | grep -q -- '--ro-bind-fd'
      - run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.93.0 fmt --all --check
      - run: cargo +1.93.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.93.0 test --locked
      - run: cargo +1.93.0 run --locked -p inodune-cli -- scan --demo --json
      - run: cargo +1.93.0 run --locked -p inodune-cli -- clean --demo --dry-run
  desktop-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install native dependencies in disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: npm ci
      - run: npm run build
      - run: cargo +1.93.0 build --locked -p inodune-desktop
      - run: cargo +1.93.0 test --locked -p inodune-desktop --features fixture-tests
      - run: cargo +1.93.0 clippy --locked -p inodune-desktop --all-targets --features fixture-tests -- -D warnings
      - name: Confirm fixture authority is rejected in release builds
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if cargo +1.93.0 check --locked --release -p inodune-desktop --features fixture-tests 2>"$log"; then
            cat "$log"
            echo 'fixture-tests unexpectedly compiled for release' >&2
            exit 1
          fi
          if ! grep -Fq 'fixture-tests is forbidden in release builds' "$log"; then
            cat "$log"
            echo 'release fixture guard failed for an unexpected reason' >&2
            exit 1
          fi

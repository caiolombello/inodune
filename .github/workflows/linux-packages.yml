name: Linux package artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Verify rootless container builder
        run: test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: npm ci
      - run: npm run build
      - name: Fetch locked Rust dependencies for offline build
        env:
          CARGO_HOME: ${{ github.workspace }}/.tools/cargo
          RUSTUP_TOOLCHAIN: 1.93.0
        run: cargo fetch --locked
      - name: Build Debian 12 compatible release binaries
        run: python3 scripts/build-linux.py
      - name: Bundle and validate DEB and RPM packages
        run: python3 scripts/package-linux.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inodune-linux-packages-${{ github.sha }}
          path: target/packages/
          if-no-files-found: error
          retention-days: 14

[package]
name = "inodune-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
inodune-core.workspace = true
inodune-clean.workspace = true
tauri-plugin-dialog = "2"
serde = "1"
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
fixture-tests = ["dep:tempfile"]

[dependencies.tempfile]
version = "3.27.0"
optional = true

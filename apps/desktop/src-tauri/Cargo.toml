[package]
name = "inodune-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Caio Barbieri <70986039+caiolombello@users.noreply.github.com>"]
homepage = "https://github.com/caiolombello/inodune"
description = "Local disk cleanup with explicit scopes and protected inventory."

[dependencies]
inodune-apps.workspace = true
tauri = { version = "2", features = [] }
inodune-core.workspace = true
inodune-clean.workspace = true
tauri-plugin-dialog = "2"
serde = "1"
serde_json = "1"
rustix = { version = "1.1.6", features = ["fs", "process"] }
getrandom = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
fixture-tests = ["dep:tempfile"]

[dependencies.tempfile]
version = "3.27.0"
optional = true

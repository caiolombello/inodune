[[permission]]
identifier = "allow-local-scan"
description = "Approve roots through native picker and request scans and native-confirmed ephemeral cleanup plans by opaque IDs. No arbitrary filesystem or shell API."
commands.allow = ["choose_scope", "list_scopes", "forget_scope", "begin_scan", "poll_scan", "control_scan", "prepare_cleanup", "begin_cleanup", "poll_cleanup", "cancel_cleanup"]
